[package]
name = "fathom"
version = "0.1.0"
edition = "2024"

[dependencies]
# UI
egui = "0.33.3"
eframe = "0.33.3"

# Async Runtime & Communication
tokio = { version = "1.48.0", features = ["full"] }
crossbeam-channel = "0.5.15"

# Kubernetes
kube = { version = "2.0.1", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.26.1", features = ["v1_34"] }
schemars = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"

# MVP helpers (logs/streaming + ergonomics)
futures-util = "0.3.31"
anyhow = "1.0.100"

# Observability
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
