[workspace]
members = [".", "daemon", "pipeline", "ui/src-tauri", "tools/devbridge"]
resolver = "3"

[package]
name = "fathom"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = ["egui-ui", "os-keyring"]
# Linux Secret Service backend (pulls libdbus). The headless in-cluster daemon builds without it (036).
os-keyring = ["keyring/sync-secret-service", "keyring/crypto-rust"]
# Legacy egui/eframe desktop UI. Kept buildable until the Tauri UI reaches parity (FR-025).
egui-ui = ["dep:egui", "dep:egui_plot", "dep:eframe", "dep:image", "dep:rfd", "dep:arboard", "dep:open"]

[[bin]]
name = "fathom"
path = "src/main.rs"
required-features = ["egui-ui"]

# 035-cloud-auth-plugins: fake ExecCredential plugin used only by integration tests.
[[bin]]
name = "fake-exec-plugin"
path = "tests/support/fake_plugin.rs"

[dependencies]
# UI (legacy egui; optional, see `egui-ui` feature)
egui = { version = "0.33.3", optional = true }
egui_plot = { version = "0.34.0", optional = true }
eframe = { version = "0.33.3", optional = true }
image = { version = "0.25.9", default-features = false, features = ["png"], optional = true }

# Rust -> TypeScript protocol bindings (ui/src/protocol/generated/)
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }

# Async Runtime & Communication
tokio = { version = "1.49.0", features = ["full"] }
async-trait = "0.1.89"
crossbeam-channel = "0.5.15"
ctrlc = "3.5.1"

# Kubernetes
# Enable ws to support port-forward over WebSockets
kube = { version = "2.0.1", features = ["runtime", "derive", "ws"] }
k8s-openapi = { version = "0.26.1", features = ["v1_34"] }
schemars = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"

# MVP helpers (logs/streaming + ergonomics)
futures-util = "0.3.31"
futures = "0.3.31"
anyhow = "1.0.100"

# Integration features (Prometheus, Grafana, port forwarding, encryption)
reqwest = { version = "0.13.1", features = ["json", "form", "default-tls"] }
rustls = { version = "0.23", features = ["ring"] }
ring = "0.17.14"
base64 = "0.22.1"
flate2 = "1"
dirs = "6.0.0"
# Materializing a release's stored chart to disk for `helm upgrade --dry-run`/`helm upgrade`
# shellouts (006-helm-mutate, research.md R4) — was a dev-only dependency, now needed at runtime.
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
urlencoding = "2.1"

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

# MCP Server for VSCode & Claude integration (stdio transport)
rmcp = { version = "0.12.0", features = ["server", "transport-io"] }
# `CancellationToken` for the stdio MCP server's graceful shutdown
# (`rmcp::service::serve_server_with_ct`, 015-mcp-agent-exposure).
tokio-util = { version = "0.7.19", features = ["rt"] }
# tonic/Hubble gRPC channel connector (`backend::hubble`), not MCP-related.
tower = "0.5"
clap = { version = "4.5", features = ["derive", "env"] }

# Native file dialogs for saving logs
rfd = { version = "0.17", optional = true }
arboard = { version = "3.6", optional = true }
open = { version = "5.3", optional = true }

# OCI Distribution client for container image inspection (010-container-image-inspection,
# research.md R1): manifest + config metadata fetch only, never layer blob pulls.
oci-client = "0.18"
# Image config (History/ImageConfiguration) parsing — already pulled in transitively by
# oci-client, declared directly since we deserialize its types ourselves.
oci-spec = { version = "0.10", default-features = false, features = ["image"] }

# Hubble/Cilium gRPC client (Observer.GetFlows)
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
hyper-util = "0.1.19"
openidconnect = "4.0.1"
arc-swap = "1.9.2"
http = "1"

# 038-sdk-login-ollama: OS credential store (Secret Service / Keychain / Credential Manager)
# and secret-hygiene wrappers. No plaintext fallback (FR-006).
secrecy = "0.10"
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3" }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[build-dependencies]
embed-resource = "3.0.6"
image = "0.25.9"
tonic-prost-build = "0.14.6"
protobuf-src = "2.1.1"

[dev-dependencies]
# Paused-time tokio tests (027 fleet poller fan-out)
tokio = { version = "1.49.0", features = ["full", "test-util"] }
# Headless GUI test harness (AccessKit-based; no window/GPU required)
egui_kittest = { version = "0.33.3", features = ["eframe"] }
accesskit = "0.21"

# Mock HTTP registry server for image-inspection auth-fallback/parsing unit tests
# (010-container-image-inspection, research.md R6) — no live registry required.
wiremock = "0.6"

# Mock OIDC provider (033 T009): sign RS256 ID tokens and publish a JWKS.
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand08 = { package = "rand", version = "0.8" }

# Tests that exercise the legacy egui UI (src/app) only build with `egui-ui`.
[[test]]
name = "gui_context_switching"
path = "tests/gui_context_switching.rs"
required-features = ["egui-ui"]

[[test]]
name = "gui_harness"
path = "tests/gui_harness.rs"
required-features = ["egui-ui"]

[[test]]
name = "gui_integrations"
path = "tests/gui_integrations.rs"
required-features = ["egui-ui"]

[[test]]
name = "gui_pods"
path = "tests/gui_pods.rs"
required-features = ["egui-ui"]

[[test]]
name = "gui_portforwards"
path = "tests/gui_portforwards.rs"
required-features = ["egui-ui"]

[[test]]
name = "gui_search_filter"
path = "tests/gui_search_filter.rs"
required-features = ["egui-ui"]

[[test]]
name = "icons"
path = "tests/icons.rs"
required-features = ["egui-ui"]

[[test]]
name = "pvc_disk_usage"
path = "tests/pvc_disk_usage.rs"
required-features = ["egui-ui"]

[lints.clippy]
# Enforce manageable code sizes - warn if functions exceed 100 lines
too_many_lines = "warn"
# Additional code quality checks
cognitive_complexity = "warn"
