[workspace]
members = [
    ".",
    "daemon",
    "pipeline",
    "ui/src-tauri",
    "tools/devbridge",
    "server",
    "crates/*",
    "apps/depths/server",
]
resolver = "3"

# Release bundles: thin LTO and one codegen unit for size/speed, symbols stripped. `panic` stays
# at the default unwind because the backend relies on `catch_unwind`.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package]
name = "fathom"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = ["os-keyring"]
# OS credential store (Secret Service over zbus / Keychain / Credential Manager). The headless
# in-cluster daemon builds without it (036).
os-keyring = ["dep:keyring"]

# 035-cloud-auth-plugins: fake ExecCredential plugin used only by integration tests.
[[bin]]
name = "fake-exec-plugin"
path = "tests/support/fake_plugin.rs"

[dependencies]

# Rust -> TypeScript protocol bindings (ui/src/protocol/generated/)
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }

# Async Runtime & Communication
tokio = { version = "1.54.1", features = ["full"] }
async-trait = "0.1.92"
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"

# Kubernetes
# Enable ws to support port-forward over WebSockets
kube = { version = "4.2.0", features = ["runtime", "derive", "ws"] }
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9"

# MVP helpers (logs/streaming + ergonomics)
futures-util = "0.3.34"
futures = "0.3.34"
anyhow = "1.0.104"

# Integration features (Prometheus, Grafana, port forwarding, encryption)
reqwest = { version = "0.13.5", features = ["json", "form", "default-tls"] }
rustls = { version = "0.23", features = ["ring"] }
ring = "0.17.14"
base64 = "0.23.1"
flate2 = "1"
dirs = "7.0.0"
# Materializing a release's stored chart to disk for `helm upgrade --dry-run`/`helm upgrade`
# shellouts (006-helm-mutate, research.md R4) — was a dev-only dependency, now needed at runtime.
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
urlencoding = "2.1"

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# MCP Server for VSCode & Claude integration (stdio transport)
rmcp = { version = "3.7.0", features = ["server", "transport-io"] }
# `CancellationToken` for the stdio MCP server's graceful shutdown
# (`rmcp::service::serve_server_with_ct`, 015-mcp-agent-exposure).
tokio-util = { version = "0.7.20", features = ["rt"] }
# tonic/Hubble gRPC channel connector (`backend::hubble`), not MCP-related.
tower = "0.5"
clap = { version = "4.6", features = ["derive", "env"] }

# Native file dialogs for saving logs

# OCI Distribution client for container image inspection (010-container-image-inspection,
# research.md R1): manifest + config metadata fetch only, never layer blob pulls.
oci-client = "0.18"
# Image config (History/ImageConfiguration) parsing — already pulled in transitively by
# oci-client, declared directly since we deserialize its types ourselves.
oci-spec = { version = "0.10", default-features = false, features = ["image"] }

# Hubble/Cilium gRPC client (Observer.GetFlows)
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
hyper-util = "0.1.21"
openidconnect = "4.0.1"
arc-swap = "1.9.3"
http = "1"

# 038-sdk-login-ollama: OS credential store (Secret Service / Keychain / Credential Manager)
# and secret-hygiene wrappers. No plaintext fallback (FR-006).
secrecy = "0.10"
keyring = { version = "4.2.0", optional = true }

[build-dependencies]
embed-resource = "3.0.12"
image = "0.25.10"
tonic-prost-build = "0.14.6"
protobuf-src = "2.1.1"

[dev-dependencies]
# Paused-time tokio tests (027 fleet poller fan-out)
tokio = { version = "1.54.1", features = ["full", "test-util"] }

# Mock HTTP registry server for image-inspection auth-fallback/parsing unit tests
# (010-container-image-inspection, research.md R6) — no live registry required.
wiremock = "0.6"

# Mock OIDC provider (033 T009): sign RS256 ID tokens and publish a JWKS. Uses rsa's own sha2
# re-export: rsa 0.9 is on digest 0.10, and sha2 0.11 moved to digest 0.11.
rsa = { version = "0.9", features = ["sha2"] }
rand08 = { package = "rand", version = "0.8" }


[lints.clippy]
# Enforce manageable code sizes - warn if functions exceed 100 lines
too_many_lines = "warn"
# Additional code quality checks
cognitive_complexity = "warn"

# A pseudo-terminal for interactive container sessions (048). `docker exec -t` refuses a stdin that
# is not a terminal and nothing in std opens one, so the pty in
# `backend::container_runtime::session` is raw `openpty`/`ioctl`. Already in the lockfile
# transitively, so naming it directly adds no download.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
