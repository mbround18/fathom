[package]
name = "fathom"
version = "0.1.0"
edition = "2024"

[dependencies]
# UI
egui = "0.33.3"
egui_plot = "0.34.0"
eframe = "0.33.3"
image = { version = "0.25.9", default-features = false, features = ["png"] }

# Async Runtime & Communication
tokio = { version = "1.48.0", features = ["full"] }
crossbeam-channel = "0.5.15"
ctrlc = "3.5.1"

# Kubernetes
# Enable ws to support port-forward over WebSockets
kube = { version = "2.0.1", features = ["runtime", "derive", "ws"] }
k8s-openapi = { version = "0.26.1", features = ["v1_34"] }
schemars = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

# MVP helpers (logs/streaming + ergonomics)
futures-util = "0.3.31"
anyhow = "1.0.100"

# Integration features (Prometheus, Grafana, port forwarding, encryption)
reqwest = { version = "0.12.28", features = ["json"] }
ring = "0.17.14"
base64 = "0.22.1"
dirs = "6.0.0"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
urlencoding = "2.1"

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

# MCP Server for VSCode & Claude integration
rmcp = { version = "0.12.0", features = ["server"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
clap = { version = "4.5", features = ["derive", "env"] }

[build-dependencies]
embed-resource = "3.0.6"
image = "0.25.9"
