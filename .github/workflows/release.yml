name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # Prereleases (v0.1.0-rc.1): the `-` is what flips `prerelease:` below.
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Re-run the release for a tag that already exists (Actions was off when it was pushed, or a
  # build needs redoing). Assets with the same name on the release are replaced.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (for example v0.1.0-rc.1)
        required: true
        type: string

permissions:
  contents: write
  # Artifact attestations (Sigstore provenance signed by GitHub's OIDC identity). Verify with:
  #   gh attestation verify Fathom_<version>_x64-setup.exe --repo mbround18/fathom
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # One tauri-action build per shipped target. MVP: Linux x86_64 only, validated by hand on
  # Ubuntu 26.04 before publishing (specs/001-tauri-shadcn-frontend, T126).
  # Every build attaches its bundles to one *draft* release under the bundler's own names
  # (Fathom_<version>_amd64.deb, Fathom-<version>-1.x86_64.rpm, Fathom_<version>_amd64.AppImage);
  # the `publish` job flips the draft once every matrix entry has uploaded, so the matrix never
  # races to create or publish the release.
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb, rpm, AppImage.
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ''
          # aarch64 Linux is dropped until someone has run its packages: no arm64 box has
          # validated them (docs/MVP.md, "aarch64 packages are untested"). The arm64 runner is
          # native because AppImage cannot be cross-compiled; restore:
          #   - {name: linux-aarch64, os: ubuntu-22.04-arm, args: ''}
          # NSIS installer. Not Authenticode-signed (no certificate); its provenance is attested
          # by GitHub instead (see permissions above). Untested on Windows as of 2026-10-14.
          - name: windows-x86_64
            os: windows-latest
            args: '--bundles nsis'
          # MVP ships Linux only, unsigned (user decision, 2026-09-26). macOS (dmg) returns after
          # the MVP along with signing and notarization; restore:
          #   - {name: macos-aarch64, os: macos-latest, args: '--target aarch64-apple-darwin', rust_targets: aarch64-apple-darwin}
          #   - {name: macos-x86_64, os: macos-latest, args: '--target x86_64-apple-darwin', rust_targets: x86_64-apple-darwin}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev pkg-config build-essential curl wget file

      # Keep in step with rust-toolchain.toml: the release is built with the same pinned compiler
      # as CI and local development, not whatever `stable` is on the day of the tag.
      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.name }}-tauri-${{ hashFiles('**/Cargo.lock') }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and attach bundles to the draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tagName: ${{ env.TAG }}
          releaseName: Fathom ${{ env.TAG }}
          releaseDraft: true
          prerelease: ${{ contains(env.TAG, '-') }}
          # Notes are rendered by scripts/release-notes.sh in the publish job.
          generateReleaseNotes: false
          args: ${{ matrix.args }}

      # The bundled libwayland-client makes WebKitGTK abort with EGL_BAD_PARAMETER (blank window)
      # on current distros, and the Tauri bundler cannot exclude it (T126). Repack the AppImage
      # without it and replace the asset tauri-action uploaded, keeping its name.
      - name: Repack AppImage with host libwayland
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          img=$(jq -r '.[] | select(endswith(".AppImage"))' <<<"$ARTIFACTS")
          scripts/appimage-host-libs.sh "$img"
          asset=$(gh release view "$TAG" --json assets \
            -q ".assets[].name | select(endswith(\"$(uname -m).AppImage\") or endswith(\"$(dpkg --print-architecture).AppImage\"))")
          [ -n "$asset" ] || { echo "no AppImage asset for $(uname -m) on the release" >&2; exit 1; }
          cp "$img" "$RUNNER_TEMP/$asset"
          gh release upload "$TAG" "$RUNNER_TEMP/$asset" --clobber

      # Sign what was just uploaded. Runs after the repack so the AppImage digest matches the
      # asset on the release. The attestation is stored by GitHub, not as a release asset.
      - name: Attest build provenance (Linux)
        if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

      - name: Attest build provenance (Windows)
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/release/bundle/nsis/*.exe

  # Publish the draft only after every build has attached its bundles. A failed build leaves the
  # draft in place for a human to inspect or delete.
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # SHA256SUMS covers every asset on the release, in the same format `make stage` writes
      # locally (sha256sum -c works against it).
      - name: Regenerate SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --skip-existing
          rm -f SHA256SUMS
          sha256sum * > ../SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" ../SHA256SUMS --clobber

      # .github/RELEASE_TEMPLATE.md + the CHANGELOG section + the asset table + GitHub's
      # auto-generated "what's changed". Re-render by hand: scripts/release-notes.sh <tag> --apply
      - name: Write release notes from the template
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release-notes.sh "$TAG" --apply

      - name: Mark the release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
