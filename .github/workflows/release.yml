name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # One tauri-action build per Tier 1 target that GitHub hosts a runner for. Windows 11, Ubuntu 26.04
  # and macOS 26 are validated by hand before publishing (specs/001-tauri-shadcn-frontend, T126).
  # tauri-action creates the release (first job wins, the rest attach) and uploads each bundle
  # renamed by `assetNamePattern` to fathom-<version>-<os>-<arch>.<ext> (FR-024).
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb, rpm, AppImage. The arm64 runner is native: AppImage cannot be cross-compiled.
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ''
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            args: ''
          # dmg
          - name: macos-aarch64
            os: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_targets: x86_64-apple-darwin
          # msi, nsis (WebView2 download bootstrapper is the Tauri default)
          - name: windows-x86_64
            os: windows-latest
            args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev pkg-config build-essential curl wget file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.name }}-tauri-${{ hashFiles('**/Cargo.lock') }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm -C ui install --frozen-lockfile

      - name: Build and publish bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tagName: ${{ github.ref_name }}
          releaseName: Fathom ${{ github.ref_name }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          assetNamePattern: fathom-[version]-[platform]-[arch][ext]
          args: ${{ matrix.args }}
