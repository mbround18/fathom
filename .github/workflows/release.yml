name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # Prereleases (v0.1.0-rc.1): the `-` is what flips `prerelease:` below.
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # One tauri-action build per shipped target. MVP: Linux x86_64 only, validated by hand on
  # Ubuntu 26.04 before publishing (specs/001-tauri-shadcn-frontend, T126).
  # Every build attaches its bundles to one *draft* release under the bundler's own names
  # (Fathom_<version>_amd64.deb, Fathom-<version>-1.x86_64.rpm, Fathom_<version>_amd64.AppImage);
  # the `publish` job flips the draft once every matrix entry has uploaded, so the matrix never
  # races to create or publish the release.
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb, rpm, AppImage.
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ''
          # aarch64 Linux is dropped until someone has run its packages: no arm64 box has
          # validated them (docs/MVP.md, "aarch64 packages are untested"). The arm64 runner is
          # native because AppImage cannot be cross-compiled; restore:
          #   - {name: linux-aarch64, os: ubuntu-22.04-arm, args: ''}
          # MVP ships Linux only, unsigned (user decision, 2026-09-26). macOS (dmg) and Windows
          # (msi, nsis) return after the MVP along with signing and notarization; restore:
          #   - {name: macos-aarch64, os: macos-latest, args: '--target aarch64-apple-darwin', rust_targets: aarch64-apple-darwin}
          #   - {name: macos-x86_64, os: macos-latest, args: '--target x86_64-apple-darwin', rust_targets: x86_64-apple-darwin}
          #   - {name: windows-x86_64, os: windows-latest, args: ''}

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev pkg-config build-essential curl wget file

      # Keep in step with rust-toolchain.toml: the release is built with the same pinned compiler
      # as CI and local development, not whatever `stable` is on the day of the tag.
      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.name }}-tauri-${{ hashFiles('**/Cargo.lock') }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm -C ui install --frozen-lockfile

      - name: Build and attach bundles to the draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tagName: ${{ github.ref_name }}
          releaseName: Fathom ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          args: ${{ matrix.args }}

      # The bundled libwayland-client makes WebKitGTK abort with EGL_BAD_PARAMETER (blank window)
      # on current distros, and the Tauri bundler cannot exclude it (T126). Repack the AppImage
      # without it and replace the asset tauri-action uploaded, keeping its name.
      - name: Repack AppImage with host libwayland
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          img=$(jq -r '.[] | select(endswith(".AppImage"))' <<<"$ARTIFACTS")
          scripts/appimage-host-libs.sh "$img"
          asset=$(gh release view "$GITHUB_REF_NAME" --json assets \
            -q ".assets[].name | select(endswith(\"$(uname -m).AppImage\") or endswith(\"$(dpkg --print-architecture).AppImage\"))")
          [ -n "$asset" ] || { echo "no AppImage asset for $(uname -m) on the release" >&2; exit 1; }
          cp "$img" "$RUNNER_TEMP/$asset"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$asset" --clobber

  # Publish the draft only after every build has attached its bundles. A failed build leaves the
  # draft in place for a human to inspect or delete.
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Mark the release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
