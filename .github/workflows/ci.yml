name: CI

# Disabled 2026-09-26: runs only on manual dispatch until the Test runner disk and E2E failures are fixed.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Tauri v2 / webkit2gtk-4.1 (ui/src-tauri, fathom-desktop).
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libssl-dev pkg-config \
            libxkbcommon-dev libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      # fathom-desktop embeds ui/dist at compile time (tauri.conf.json frontendDist) and
      # fails to build if it is missing. The real UI build is checked by the `ui` job;
      # the Rust jobs only need the directory to exist.
      - name: Stub ui/dist for the Tauri crate
        run: |
          mkdir -p ui/dist
          [ -f ui/dist/index.html ] || echo '<!doctype html><title>Fathom</title>' > ui/dist/index.html

      - name: Cargo check
        run: cargo check --all-targets

      - name: Cargo check (backend library)
        run: cargo check --no-default-features --lib

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (fathom-desktop)
        run: cargo clippy -p fathom-desktop -- -D warnings

      - name: Rustfmt
        run: cargo fmt --check

      - name: No LDAP crate (spec 033)
        run: scripts/check-no-ldap.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      # Tauri v2 / webkit2gtk-4.1 (ui/src-tauri, fathom-desktop).
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libssl-dev pkg-config \
            libxkbcommon-dev libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      # fathom-desktop embeds ui/dist at compile time (tauri.conf.json frontendDist) and
      # fails to build if it is missing. The real UI build is checked by the `ui` job;
      # the Rust jobs only need the directory to exist.
      - name: Stub ui/dist for the Tauri crate
        run: |
          mkdir -p ui/dist
          [ -f ui/dist/index.html ] || echo '<!doctype html><title>Fathom</title>' > ui/dist/index.html

      - name: Run tests
        run: cargo test --all

      # Constitution Principle III: generated bindings MUST be checked for drift.
      # `git add -N` makes newly generated (untracked) files show up in the diff too.
      - name: Check generated bindings for drift
        run: |
          cargo test -p fathom --test export_bindings
          git add --intent-to-add ui/src/protocol/generated
          if ! git diff --exit-code ui/src/protocol/generated; then
            echo "::error::ui/src/protocol/generated is stale. Run 'cargo test -p fathom --test export_bindings' and commit the result."
            exit 1
          fi

  ui:
    name: UI (lint, typecheck, unit, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in ui/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E tests (Chromium + WebKit, fake backend)
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 14
          if-no-files-found: ignore
