name: CI

# Disabled 2026-09-26: runs only on manual dispatch (out of Actions minutes). Every job is
# `scripts/ci.sh <job>`, the same command that runs CI locally through paws, so a green local run
# is the check that matters until triggers come back.
on:
  workflow_dispatch:

jobs:
  ci:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [shared, fathom-full, depths, keel]
    steps:
      - uses: actions/checkout@v4

      # `paws run` (and paws-up's `git-ref` input) are on mbround18/paws branch
      # feat/fathom-local-ci, not in a release yet. Once a release has them, switch to the
      # release's `version:` and pin the action to that tag.
      - uses: mbround18/paws/actions/paws-up@feat/fathom-local-ci
        with:
          git-ref: feat/fathom-local-ci

      # Runners have 4 cores and 16GB; scripts/ci.sh's defaults are sized for a shared workstation.
      - run: scripts/ci.sh ${{ matrix.job }}
        env:
          CARGO_BUILD_JOBS: "4"
          PLAYWRIGHT_WORKERS: "4"
          CI_NICE: "0"
