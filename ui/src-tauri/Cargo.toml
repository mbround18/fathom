[package]
name = "fathom-desktop"
version = "0.1.0"
description = "Fathom Kubernetes dashboard: Tauri v2 desktop shell"
# The deb `Maintainer:` field: tauri-bundler takes it from here (then `bundle.publisher`).
authors = ["MBRound18 <michael.bruno1337@gmail.com>"]
edition = "2024"
publish = false

[lib]
name = "fathom_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fathom-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fathom = { path = "../..", default-features = false, features = ["os-keyring"] }
tauri = { version = "2", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
crossbeam-channel = "0.5.17"
tracing = "0.1.44"
ctrlc = "3.5.2"
clap = { version = "4.6", features = ["derive", "env"] }
tauri-plugin-opener = "2.7.2"

[target.'cfg(unix)'.dependencies]
# setsid() for the login-shell environment import (login_env.rs).
libc = "0.2.191"
