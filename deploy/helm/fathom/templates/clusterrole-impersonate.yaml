{{- if eq .Values.accessModel "impersonation" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fathom.fullname" . }}-impersonate
  labels:
    {{- include "fathom.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
    {{- with .Values.impersonation.resourceNames }}
    resourceNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
