{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fathom.fullname" . }}
  labels:
    {{- include "fathom.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "fathom.selector" . | nindent 6 }}
{{- end }}
