{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fathom.fullname" . }}
  labels:
    {{- include "fathom.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fathom.selector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
{{- end }}
