{{- if eq .Values.accessModel "impersonation" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fathom.fullname" . }}-impersonate
  labels:
    {{- include "fathom.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "fathom.fullname" . }}-impersonate
subjects:
  - kind: ServiceAccount
    name: {{ include "fathom.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
