            capabilities: { drop: [ALL] }
---
# Error state: exits 1 every few seconds -> CrashLoopBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
spec:
  replicas: 1
  selector:
    matchLabels: { app: crashloop }
  template:
    metadata:
      labels: { app: crashloop }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'echo "fatal: config missing" >&2; sleep 5; exit 1']
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 20m, memory: 16Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
# Pending state: no node carries this label.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unschedulable
spec:
  replicas: 1
  selector:
    matchLabels: { app: unschedulable }
  template:
    metadata:
      labels: { app: unschedulable }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      nodeSelector: { fathom.dev/no-such-node: "true" }
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'sleep infinity']
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 20m, memory: 16Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
# ImagePullBackOff state (the registry name cannot resolve).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image
spec:
  replicas: 1
  selector:
    matchLabels: { app: bad-image }
  template:
    metadata:
      labels: { app: bad-image }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: main
          image: registry.fathom.invalid/does-not-exist:0.0.0
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 20m, memory: 16Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
# One replica, no volumes (the quota forbids PVCs; Longhorn stays untouched).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kv
spec:
  serviceName: kv
  replicas: 1
  selector:
    matchLabels: { app: kv }
  template:
    metadata:
      labels: { app: kv }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'echo kv-$HOSTNAME ready; sleep infinity']
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 20m, memory: 16Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: kv
spec:
  clusterIP: None
  selector: { app: kv }
  ports: [{ name: kv, port: 6379 }]
---
# One tiny pod per node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  selector:
    matchLabels: { app: node-agent }
  template:
    metadata:
      labels: { app: node-agent }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'while true; do echo heartbeat $(date -Iseconds); sleep 60; done']
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 20m, memory: 16Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-once
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'echo migrating; sleep 3; echo done']
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 20m, memory: 16Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: main
              image: busybox:1.37
              command: ["sh", "-c", 'echo report generated at $(date -Iseconds)']
              resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 20m, memory: 16Mi } }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
