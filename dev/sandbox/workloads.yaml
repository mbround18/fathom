# Healthy, probed, serviced: the "normal" workload.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          # Skip /docker-entrypoint.d: its IPv6 script asks apk for package checksums, which
          # hangs ~120 s under the namespace's egress policy and delays readiness.
          command: [nginx, -g, "daemon off;"]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: GREETING
              valueFrom: { configMapKeyRef: { name: web-config, key: greeting } }
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: web }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 80 } }
---
# Log follow / pause / truncation practice: ~5 lines per second, stderr every 10th.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatty-logger
spec:
  replicas: 1
  selector:
    matchLabels: { app: chatty-logger }
  template:
    metadata:
      labels: { app: chatty-logger }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'i=0; while true; do i=$((i+1)); echo "$(date -Iseconds) level=info seq=$i msg=\\"tick\\""; if [ $((i % 10)) -eq 0 ]; then echo "$(date -Iseconds) level=warn seq=$i msg=\\"every tenth line\\"" >&2; fi; sleep 0.2; done']
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 20m, memory: 16Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
# Scale target for the live e2e suite; the suite scales it and restores 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-me
spec:
  replicas: 1
  selector:
    matchLabels: { app: scale-me }
  template:
    metadata:
      labels: { app: scale-me }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'sleep infinity']
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 20m, memory: 16Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
# Rollout-restart target for the live e2e suite.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restart-me
spec:
  replicas: 1
  selector:
    matchLabels: { app: restart-me }
  template:
    metadata:
      labels: { app: restart-me }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: main
