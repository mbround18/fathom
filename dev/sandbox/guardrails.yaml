# Caps what the sandbox (and any test that misbehaves) can consume.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
spec:
  hard:
    pods: "30"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
    count/ingresses.networking.k8s.io: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-defaults
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 5m, memory: 16Mi }
      default: { cpu: 50m, memory: 64Mi }
      max: { cpu: 200m, memory: 256Mi }
---
# Nothing outside the namespace can reach sandbox pods, and sandbox pods can
# only reach each other and cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-namespace
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
