apiVersion: v1
kind: Config
current-context: prod
clusters:
  - name: prod-cluster
    cluster:
      server: https://prod.example.com:6443
  - name: staging-cluster
    cluster:
      server: https://staging.example.com:6443
users:
  - name: prod-user
    user:
      token: prod-token
  - name: staging-user
    user:
      token: staging-token
contexts:
  - name: prod
    context:
      cluster: prod-cluster
      user: prod-user
  - name: staging
    context:
      cluster: staging-cluster
      user: staging-user
