<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Keel logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b1a"/>
      <stop offset="100%" stop-color="#0c1228"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- Traditional Chinese glyph: 舵 (rudder/helm), matching orchestration/control semantics -->
  <text
    x="140"
    y="210"
    fill="#3ef2ff"
    font-size="180"
    font-family="'Yuji Boku', serif"
    filter="url(#glow)"
  >舵</text>

  <text
    x="330"
    y="205"
    fill="#d6f6ff"
    font-size="96"
    letter-spacing="20"
    font-weight="700"
    font-family="'Chakra Petch', system-ui, sans-serif"
  >KEEL</text>
</svg>
