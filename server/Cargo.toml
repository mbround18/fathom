[package]
name = "fathom-server"
version = "0.1.0"
description = "Hosted server shell for Fathom: OIDC sign-in, per-user backend over WebSocket"
edition = "2024"
publish = false

[lib]
name = "fathom_server"
path = "src/lib.rs"

[[bin]]
name = "fathom-server"
path = "src/main.rs"

[dependencies]
fathom = { path = "..", default-features = false }
anyhow = "1.0.100"
axum = { version = "0.8", features = ["macros"] }
openidconnect = { version = "4", default-features = false }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
secrecy = "0.10"
rand = "0.9"
tokio = { version = "1.49.0", features = ["full"] }
tokio-tungstenite = "0.27"
reqwest = { version = "0.13.1", features = ["json", "default-tls"] }
kube = "2.0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
