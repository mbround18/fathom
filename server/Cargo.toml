[package]
name = "fathom-server"
version = "0.1.0"
description = "Hosted server shell for Fathom: OIDC sign-in, per-user backend over WebSocket"
edition = "2024"
publish = false

[lib]
name = "fathom_server"
path = "src/lib.rs"

[[bin]]
name = "fathom-server"
path = "src/main.rs"

[dependencies]
fathom = { path = "..", default-features = false }
anyhow = "1.0.104"
axum = { version = "0.8", features = ["macros"] }
openidconnect = { version = "4", default-features = false }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
secrecy = "0.10"
rand = "0.9"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.27"
reqwest = { version = "0.13.5", features = ["json", "default-tls"] }
kube = "2.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
base64 = "0.22"
subtle = "2.6"
url = "2.5"
thiserror = "2"
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
http = "1"
async-trait = "0.1"
crossbeam-channel = "0.5.17"
futures = "0.3.34"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
rsa = "0.9"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
