apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Prometheus + kube-state-metrics + node-exporter. Query: http://prometheus:9090/api/v1/query
# Uninstall: k8s/cluster.sh down-metrics prometheus (label part-of=fathom-metrics).
namespace: fathom-metrics-prometheus
labels:
  - pairs:
      app.kubernetes.io/part-of: fathom-metrics
      fathom.dev/metrics-stack: prometheus
    includeSelectors: false
resources:
  - namespace.yaml
  - ../../addons/prometheus
