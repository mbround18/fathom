apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# VictoriaMetrics single-node + vmagent (+ kube-state-metrics, node-exporter). Query: http://victoria-metrics:8428/api/v1/query
# Uninstall: k8s/cluster.sh down-metrics victoriametrics (label part-of=fathom-metrics).
namespace: fathom-metrics-victoriametrics
labels:
  - pairs:
      app.kubernetes.io/part-of: fathom-metrics
      fathom.dev/metrics-stack: victoriametrics
    includeSelectors: false
resources:
  - namespace.yaml
  - ../../addons/victoriametrics
  - ../../addons/vmagent
patches:
  - target: {kind: Deployment, name: vmagent}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: http://victoria-metrics:8428/api/v1/write
