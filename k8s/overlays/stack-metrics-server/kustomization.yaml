apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# metrics.k8s.io baseline. Uninstall: k8s/cluster.sh down-metrics metrics-server (label part-of=fathom-metrics).
labels:
  - pairs:
      app.kubernetes.io/part-of: fathom-metrics
      fathom.dev/metrics-stack: metrics-server
    includeSelectors: false
resources:
  - ../../addons/metrics-server
