# RustFS (Apache-2.0; project preference over MinIO) as the S3 store for Mimir / Thanos. emptyDir: throwaway.
# Secret rustfs-root (access-key, secret-key) is generated once by cluster.sh and reused on re-run.
apiVersion: apps/v1
kind: Deployment
metadata: {name: rustfs}
spec:
  replicas: 1
  selector: {matchLabels: {app: rustfs}}
  template:
    metadata: {labels: {app: rustfs}}
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-rc.2
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: rustfs-root, key: access-key}}
            - name: RUSTFS_SECRET_KEY
              valueFrom: {secretKeyRef: {name: rustfs-root, key: secret-key}}
            - {name: RUSTFS_VOLUMES, value: /data}
            - {name: RUSTFS_OBS_LOGGER_LEVEL, value: warn}
          ports: [{name: s3, containerPort: 9000}]
          readinessProbe: {httpGet: {path: /health, port: s3}, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 256Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: rustfs}
spec:
  selector: {app: rustfs}
  ports: [{name: s3, port: 9000}]
