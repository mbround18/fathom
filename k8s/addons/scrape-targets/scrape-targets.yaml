# Shared scrape side for Prometheus-API stacks: scraper RBAC, kube-state-metrics v2.17.0, node-exporter v1.9.1.
# No namespaces here: the stack overlay's `namespace:` transformer places everything.
apiVersion: v1
kind: ServiceAccount
metadata: {name: scraper}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: fathom-metrics-scraper}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, pods, services, endpoints]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: fathom-metrics-scraper}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fathom-metrics-scraper}
subjects: [{kind: ServiceAccount, name: scraper, namespace: default}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-state-metrics}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: fathom-metrics-kube-state-metrics}
rules:
  - apiGroups: ["", apps, batch, autoscaling, networking.k8s.io, storage.k8s.io, policy]
    resources: ["*"]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: fathom-metrics-kube-state-metrics}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fathom-metrics-kube-state-metrics}
subjects: [{kind: ServiceAccount, name: kube-state-metrics, namespace: default}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata: {labels: {app: kube-state-metrics}}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: 8081}}
          resources: {requests: {cpu: 10m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics}
spec:
  selector: {app: kube-state-metrics}
  ports: [{name: http, port: 8080}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: node-exporter}
spec:
  selector: {matchLabels: {app: node-exporter}}
  template:
    metadata: {labels: {app: node-exporter}}
    spec:
      hostNetwork: true
      hostPID: true
      tolerations: [{operator: Exists}]
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.9.1
          args: [--path.rootfs=/host, --web.listen-address=:9100]
          ports: [{name: metrics, containerPort: 9100, hostPort: 9100}]
          resources: {requests: {cpu: 10m, memory: 32Mi}}
          volumeMounts: [{name: root, mountPath: /host, readOnly: true}]
      volumes: [{name: root, hostPath: {path: /}}]
---
apiVersion: v1
kind: Service
metadata: {name: node-exporter}
spec:
  selector: {app: node-exporter}
  ports: [{name: metrics, port: 9100}]
