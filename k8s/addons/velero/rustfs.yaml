apiVersion: v1
kind: Namespace
metadata: {name: velero}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rustfs, namespace: velero}
spec:
  selector: {matchLabels: {app: rustfs}}
  template:
    metadata: {labels: {app: rustfs}}
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-rc.2
          env:
            - {name: RUSTFS_ACCESS_KEY, value: rustfsadmin}
            - {name: RUSTFS_SECRET_KEY, value: rustfsadmin}
            - {name: RUSTFS_VOLUMES, value: /data}
          ports: [{containerPort: 9000}]
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: rustfs, namespace: velero}
spec:
  selector: {app: rustfs}
  ports: [{port: 9000}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: rustfs-make-bucket, namespace: velero}
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws
          image: amazon/aws-cli:2.17.0
          env:
            - {name: AWS_ACCESS_KEY_ID, value: rustfsadmin}
            - {name: AWS_SECRET_ACCESS_KEY, value: rustfsadmin}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
          command: [sh, -c, "until aws --endpoint-url http://rustfs.velero.svc:9000 s3 mb s3://velero; do sleep 3; done"]
