apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/knative/serving/releases/download/knative-v1.15.2/serving-core.yaml
  - https://github.com/knative/net-kourier/releases/download/knative-v1.15.1/kourier.yaml
patches:
  - target: {kind: ConfigMap, name: config-network, namespace: knative-serving}
    patch: |-
      - op: add
        path: /data/ingress-class
        value: kourier.ingress.networking.knative.dev
