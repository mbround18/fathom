# VictoriaMetrics single-node v1.122.0 (Apache-2.0); Prometheus-compatible query API on :8428 (/api/v1/query).
apiVersion: apps/v1
kind: Deployment
metadata: {name: victoria-metrics}
spec:
  replicas: 1
  selector: {matchLabels: {app: victoria-metrics}}
  template:
    metadata: {labels: {app: victoria-metrics}}
    spec:
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:v1.122.0
          args: [-storageDataPath=/data, -retentionPeriod=1d, -httpListenAddr=:8428]
          ports: [{name: http, containerPort: 8428}]
          readinessProbe: {httpGet: {path: /health, port: http}}
          resources: {requests: {cpu: 100m, memory: 128Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: victoria-metrics}
spec:
  selector: {app: victoria-metrics}
  ports: [{name: http, port: 8428}]
