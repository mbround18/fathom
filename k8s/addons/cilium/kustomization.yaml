# Cilium CNI + Hubble Relay for the Integrations > Hubble pane. Needs a kind cluster created
# WITHOUT the default CNI (k8s/kind-cilium.yaml), so it is not part of overlays/full:
#   k8s/cluster.sh up-cilium     # kind cluster fathom-cilium + this addon + a traffic sample
#   k8s/cluster.sh down-cilium
# Fathom finds the `hubble-relay` Service and port-forwards its gRPC port (4245, plaintext).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.20.2
    releaseName: cilium
    namespace: kube-system
    valuesInline:
      ipam: {mode: kubernetes}
      operator: {replicas: 1}
      hubble:
        enabled: true
        relay: {enabled: true}
        ui: {enabled: false}
