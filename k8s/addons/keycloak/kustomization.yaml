# Keycloak IdP for the hosted kind overlay (spec 031). Issuer: https://keycloak.localtest.me/realms/fathom
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - namespace.yaml
  - keycloak.yaml
  - ingress.yaml
configMapGenerator:
  - name: keycloak-realm
    files: [fathom-realm.json]
    options: {disableNameSuffixHash: true}
