# Traffic for the Hubble pane. Applied to every cluster that gets Cilium: `k8s/cluster.sh up`
# (fathom-dev) and `k8s/cluster.sh up-cilium` (fathom-cilium).
apiVersion: v1
kind: Namespace
metadata:
  name: hubble-demo
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: hubble-demo}
spec:
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - {name: web, image: nginx:1.27-alpine, ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: hubble-demo}
spec: {selector: {app: web}, ports: [{port: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: locked, namespace: hubble-demo}
spec:
  selector: {matchLabels: {app: locked}}
  template:
    metadata: {labels: {app: locked}}
    spec:
      containers:
        - {name: web, image: nginx:1.27-alpine, ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: locked, namespace: hubble-demo}
spec: {selector: {app: locked}, ports: [{port: 80}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: locked-deny-all, namespace: hubble-demo}
spec:
  podSelector: {matchLabels: {app: locked}}
  policyTypes: [Ingress]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client, namespace: hubble-demo}
spec:
  selector: {matchLabels: {app: client}}
  template:
    metadata: {labels: {app: client}}
    spec:
      containers:
        - name: client
          image: busybox:1.37
          command: [sh, -c, 'while true; do wget -q -T 2 -O /dev/null http://web; wget -q -T 2 -O /dev/null http://locked; sleep 2; done']
