# Restricted-permissions identity for testing Fathom as a namespace-scoped user (kind only).
# Not part of kustomization.yaml: apply it on demand, then remove it again (see k8s/README.md
# § Restricted user).
#
#   ServiceAccount fathom-dev/fathom-restricted
#     edit  (RoleBinding) in fathom-dev and demo
#     view  (RoleBinding) in default
#     nothing cluster-scoped: it cannot list namespaces, nodes, PVs, StorageClasses,
#     ClusterRoles, CRDs, ... and cannot list any namespaced kind across all namespaces.
#
# Every object carries fathom.dev/restricted-user=true so one label selector removes them all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fathom-restricted
  namespace: fathom-dev
  labels: {fathom.dev/restricted-user: "true"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fathom-restricted-edit
  namespace: fathom-dev
  labels: {fathom.dev/restricted-user: "true"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
subjects: [{kind: ServiceAccount, name: fathom-restricted, namespace: fathom-dev}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fathom-restricted-edit
  namespace: demo
  labels: {fathom.dev/restricted-user: "true"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
subjects: [{kind: ServiceAccount, name: fathom-restricted, namespace: fathom-dev}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fathom-restricted-view
  namespace: default
  labels: {fathom.dev/restricted-user: "true"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{kind: ServiceAccount, name: fathom-restricted, namespace: fathom-dev}]
