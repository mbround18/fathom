# Event generators for the in-cluster daemon (spec 036). Apply with: kubectl apply -f k8s/samples/daemon-events.yaml
# Controllable rollout: `kubectl -n daemon-demo set image deploy/rollout-demo web=nginx:1.27-alpine` (or rollout restart).
apiVersion: v1
kind: Namespace
metadata:
  name: daemon-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-demo
  namespace: daemon-demo
spec:
  replicas: 2
  selector: {matchLabels: {app: rollout-demo}}
  template:
    metadata: {labels: {app: rollout-demo}}
    spec:
      containers:
        - name: web
          image: nginx:1.26-alpine
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: failing-job
  namespace: daemon-demo
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: fail
          image: busybox:1.36
          command: [sh, -c, "echo failing; exit 1"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tick
  namespace: daemon-demo
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tick
              image: busybox:1.36
              command: [sh, -c, "date"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rollout-demo
  namespace: daemon-demo
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: rollout-demo}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
