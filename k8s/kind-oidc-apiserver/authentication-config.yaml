# Structured authentication (kube-apiserver --authentication-config). Preferred over the
# legacy --oidc-* flags: multiple audiences, CEL claim mapping, per-issuer CA.
# `fathom-desktop` is the ONLY audience Fathom mints tokens for; the legacy `fathom` client id
# is kept as a second audience so the 011 web flow keeps working (audienceMatchPolicy).
apiVersion: apiserver.config.k8s.io/v1beta1
kind: AuthenticationConfiguration
jwt:
  - issuer:
      url: https://auth.localtest.me/auth/v1/
      audiences: [fathom-desktop, fathom]
      audienceMatchPolicy: MatchAny
      certificateAuthority: |
