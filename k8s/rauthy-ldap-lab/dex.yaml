apiVersion: apps/v1
kind: Deployment
metadata: {name: dex}
spec:
  replicas: 1
  selector: {matchLabels: {app: dex}}
  template:
    metadata: {labels: {app: dex}}
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports: [{containerPort: 5556}]
          volumeMounts: [{name: config, mountPath: /etc/dex}]
      volumes:
        - name: config
          configMap: {name: dex-config}
---
apiVersion: v1
kind: Service
metadata: {name: dex}
spec:
  selector: {app: dex}
  ports: [{port: 5556}]
---
# Browser-facing ingress so the login redirect works from the host (dex.localtest.me -> 127.0.0.1).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: dex}
spec:
  ingressClassName: nginx
  rules:
    - host: dex.localtest.me
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: dex, port: {number: 5556}}}}
