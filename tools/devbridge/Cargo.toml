[package]
name = "fathom-devbridge"
version = "0.1.0"
description = "Dev-only WebSocket bridge to the Fathom backend for real-cluster Playwright runs"
edition = "2024"
publish = false

[lib]
name = "fathom_devbridge"
path = "src/lib.rs"

[[bin]]
name = "fathom-devbridge"
path = "src/main.rs"

[dependencies]
fathom = { path = "../..", default-features = false }
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
futures-util = "0.3.34"
k8s-openapi = { version = "0.26.1", features = ["v1_34"] }
kube = "2.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# Same version kube's `ws` feature already pulls in: no new WebSocket stack.
tokio-tungstenite = "0.30"
tracing = "0.1.44"
urlencoding = "2.1"
