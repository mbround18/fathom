[package]
name = "audit-log"
version = "0.1.0"
description = "Append-only JSON-lines audit log with size rotation"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3"
