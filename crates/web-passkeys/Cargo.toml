[package]
name = "web-passkeys"
version = "0.1.0"
description = "Passkeys for the suite's servers: store trait, ceremonies, recovery codes, pure verify_assertion"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
# Registration and authentication ceremonies, the store trait and recovery codes. They need
# webauthn-rs, which links OpenSSL (attestation CA checks). Verify-only users (keel-trust, and so
# Keel's runner and relay) turn default features off and get `verify_assertion`, `CoseKey` and
# `b64` without OpenSSL (spec 067 T067).
default = ["ceremonies"]
ceremonies = ["dep:async-trait", "dep:rand", "dep:webauthn-rs"]

[dependencies]
async-trait = { version = "0.1", optional = true }
base64 = "0.23"
ed25519-dalek = "2.2.0"
p256 = "0.13.2"
rand = { version = "0.10", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
webauthn-rs = { version = "0.5.5", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
# A software passkey for ceremony tests (no hardware, deterministic).
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }

[[test]]
name = "ceremony"
required-features = ["ceremonies"]

[[test]]
name = "recovery"
required-features = ["ceremonies"]
