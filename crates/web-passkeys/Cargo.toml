[package]
name = "web-passkeys"
version = "0.1.0"
description = "Passkeys for the suite's servers: store trait, ceremonies, recovery codes, pure verify_assertion"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.23"
ed25519-dalek = "2.2.0"
p256 = "0.13.2"
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
webauthn-rs = "0.5.5"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
# A software passkey for ceremony tests (no hardware, deterministic).
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
