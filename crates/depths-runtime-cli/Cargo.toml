[package]
name = "depths-runtime-cli"
version = "0.1.0"
description = "Depths container-runtime adapter: the docker CLI, argv only, never a shell"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
# The port this crate implements.
depths-core = { path = "../depths-core" }
# The `docker ps` template and its parser, shared with Fathom.
container-runtime = { path = "../container-runtime" }
# SIGINT to a running compose process on cancel, without `unsafe`.
rustix = { version = "1.1.5", features = ["process"] }
# `docker inspect` and `docker info` JSON, for the containment profile.
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3"
