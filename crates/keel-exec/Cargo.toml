[package]
name = "keel-exec"
version = "0.1.0"
description = "Keel's runner channel: frames, codec, SSH CA/KRL, SSH configs, pack builder, keel_events parser"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
# The in-process runner test double (`fake` module). Only tests and the fake backend enable it.
fake = []

[dependencies]
# Binary frame fields (`Pack.chunk`, `Log.bytes`, `Krl.bytes`) travel as base64 inside JSON.
base64 = "0.23.1"
keel-trust = { path = "../keel-trust" }
# The same rand_core (0.10) as the ssh-key that russh re-exports, for CA keys, nonces and serials.
rand = "0.10.3"
# SSH keys and certificates come from `russh::keys` (its ssh-key 0.7), so this crate uses one
# ssh-key version.
russh = "0.65.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The pack digest on the last `Pack` frame.
sha2 = "0.11"
thiserror = "2.0.18"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
