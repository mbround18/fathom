[package]
name = "keel-exec"
version = "0.1.0"
description = "Keel's runner channel: frames, codec, SSH CA/KRL, SSH configs, pack builder, keel_events parser"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
# The in-process runner test double (`fake` module). Only tests and the fake backend enable it.
fake = []

[dependencies]
keel-trust = { path = "../keel-trust" }
russh = "0.65.0"
serde_json = "1.0.154"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
