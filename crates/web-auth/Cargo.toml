[package]
name = "web-auth"
version = "0.1.0"
description = "Browser sign-in for the suite's servers: OIDC and GitHub, sessions, CSRF"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.23"
http = "1"
openidconnect = { version = "4", default-features = false }
rand = "0.10"
reqwest = { version = "0.13.5", features = ["json", "default-tls"] }
secrecy = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
