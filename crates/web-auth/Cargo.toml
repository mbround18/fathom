[package]
name = "web-auth"
version = "0.1.0"
description = "Browser sign-in for the suite's servers: OIDC and GitHub, sessions, CSRF"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.23"
rand = "0.10"
secrecy = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
