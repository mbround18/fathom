[package]
name = "depths-server"
version = "0.1.0"
description = "Depths: self-hosted Docker Compose stack manager (Axum + Tower)"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "depths"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7", features = ["fs"] }
