[package]
name = "keel-runner"
version = "0.1.0"
description = "Keel host runner: keel-runner (network half) and keel-executor (runs Ansible)"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "keel-runner"
path = "src/bin/keel-runner.rs"

[[bin]]
name = "keel-executor"
path = "src/bin/keel-executor.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
# The executor's Git store: unpack a pack and read trees. Isolated open, no hooks, no worktree.
gix = { version = "0.90.0", default-features = false, features = ["sha1"] }
# gix only exposes pack indexing behind its network features; this enables it alone.
gix-pack = { version = "0.77.0", default-features = false, features = ["sha1", "streaming-input"] }
keel-core = { path = "../../../crates/keel-core" }
keel-exec = { path = "../../../crates/keel-exec" }
keel-trust = { path = "../../../crates/keel-trust" }
# setpgid, dup2 and killpg for the ansible-playbook process group.
libc = "0.2.191"
# The same rand_core as russh's ssh-key, for the runner's Ed25519 key.
rand = "0.10.3"
russh = "0.65.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "io-std",
    "sync",
    "time",
    "process",
    "fs",
    "signal",
] }
toml = "1.1"

[dev-dependencies]
keel-exec = { path = "../../../crates/keel-exec", features = ["fake"] }
tempfile = "3"
