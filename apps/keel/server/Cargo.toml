[package]
name = "keel-server"
version = "0.1.0"
description = "Keel: Git-bound Ansible control plane server (Axum + Tower, PostgreSQL)"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
# XChaCha20-Poly1305 sealing of credentials at rest (research.md).
chacha20poly1305 = "0.11.0"
clap = { version = "4.6", features = ["derive", "env"] }
ed25519-dalek = "2.2.0"
hmac = "0.13"
keel-core = { path = "../../../crates/keel-core" }
keel-exec = { path = "../../../crates/keel-exec" }
keel-git = { path = "../../../crates/keel-git" }
keel-protocol = { path = "../../../crates/keel-protocol" }
keel-trust = { path = "../../../crates/keel-trust" }
opentelemetry = "0.33.1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "macros",
    "migrate",
    "uuid",
    "time",
    "json",
] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower = "0.5"
tracing = "0.1.44"
web-auth = { path = "../../../crates/web-auth" }
web-passkeys = { path = "../../../crates/web-passkeys" }
