[package]
name = "keel-server"
version = "0.1.0"
description = "Keel: Git-bound Ansible control plane server (Axum + Tower, PostgreSQL)"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "keel_server"
path = "src/lib.rs"

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
# PasskeyStore is an async trait (web-passkeys).
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "http1", "service", "tokio", "server-graceful"] }
# OS randomness for data keys and nonces (the same crate web-auth uses).
rand = "0.10"
secrecy = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tower-http = { version = "0.7", features = ["fs", "limit", "timeout"] }
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
# XChaCha20-Poly1305 sealing of credentials at rest (research.md).
chacha20poly1305 = "0.11.0"
clap = { version = "4.6", features = ["derive", "env"] }
ed25519-dalek = "2.2.0"
hmac = "0.13"
keel-core = { path = "../../../crates/keel-core" }
keel-exec = { path = "../../../crates/keel-exec" }
keel-git = { path = "../../../crates/keel-git" }
keel-protocol = { path = "../../../crates/keel-protocol" }
keel-trust = { path = "../../../crates/keel-trust" }
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "macros",
    "migrate",
    "uuid",
    "time",
    "json",
] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower = "0.5"
tracing = "0.1.44"
web-auth = { path = "../../../crates/web-auth" }
web-passkeys = { path = "../../../crates/web-passkeys" }
# The WebAuthn types web-passkeys' ceremonies take (the same version it uses).
webauthn-rs = "0.5.5"

[dev-dependencies]
# The fake runner for the run tests (no real ansible).
keel-exec = { path = "../../../crates/keel-exec", features = ["fake"] }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
# A WebSocket client for the /api/v1/ws tests (the same one the Depths server tests use).
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
# A software passkey for the passkey command tests (no hardware, deterministic).
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
