[package]
name = "fathom-daemon"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "fathom_daemon"
path = "src/lib.rs"

[[bin]]
name = "fathom-daemon"
path = "src/main.rs"

[dependencies]
# Shared protocol/backend lib WITHOUT the legacy egui UI (036 research R3).
fathom = { path = "..", default-features = false }
axum = "0.8"
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = "0.1"
kube = { version = "2.0.1", features = ["runtime"] }
k8s-openapi = { version = "0.26.1", features = ["v1_34"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.100"
async-trait = "0.1.89"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures = "0.3.31"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
# Front-proxy mTLS (client cert verified against the requestheader CA)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tower-test = "0.4"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1.49.0", features = ["full", "test-util"] }

[lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
